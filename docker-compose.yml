name: to-dos-app

services:
  postgres:
    image: postgres:alpine
    container_name: todo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - existing_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: todo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  existing_postgres_data:
    external: true
    name: 45eb26033c2aeedfae554ea6b6d0ec56f2bbbeb02d61a763681fc68779792006

  redis_data:
